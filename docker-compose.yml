services:
  proxy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    environment:
      CADDY_HOST: ${CADDY_HOST:-localhost}
    depends_on:
      - api
    restart: unless-stopped

  api:
    image: ${BEACON_IMAGE:-ghcr.io/tombartindale/nucs}:${BEACON_IMAGE_TAG:-latest}
    command: ["--root", "/data/programme", "--data-dir", "/data/ui-state", "--port", "8420", "--host", "0.0.0.0"]
    environment:
      DATABASE_URL: postgres://beacon:${POSTGRES_PASSWORD:-beacon}@postgres:5432/beacon
      REDIS_URL: redis://redis:6379
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-}
      ALLOWED_EMAIL_DOMAINS: ${ALLOWED_EMAIL_DOMAINS:-northumbria.ac.uk}
      MAGIC_LINK_BASE_URL: ${MAGIC_LINK_BASE_URL:-http://localhost}
      EMAIL_FROM: ${EMAIL_FROM:-beacon@localhost}
      SENDGRID_API_KEY: ${SENDGRID_API_KEY:-}
      ADMIN_EMAILS: ${ADMIN_EMAILS:-}
      S3_BACKUP_BUCKET: ${S3_BACKUP_BUCKET:-}
      S3_BACKUP_PREFIX: ${S3_BACKUP_PREFIX:-postgres}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-us-east-1}
      # Video lives in this bucket (see deploy/media/setup-bucket.sh); the api hands the browser
      # presigned URLs to upload and play it. Blank keeps video on the programme volume.
      S3_MEDIA_BUCKET: ${S3_MEDIA_BUCKET:-}
      S3_MEDIA_PREFIX: ${S3_MEDIA_PREFIX:-media}
      S3_MEDIA_REGION: ${S3_MEDIA_REGION:-}
    volumes:
      - programme-root:/data/programme
      - ui-state:/data/ui-state
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  worker:
    image: ${BEACON_IMAGE:-ghcr.io/tombartindale/nucs}:${BEACON_IMAGE_TAG:-latest}
    entrypoint: ["node", "/app/ui/server/dist/worker.js"]
    environment:
      BEACON_ROOT: /data/programme
      DATABASE_URL: postgres://beacon:${POSTGRES_PASSWORD:-beacon}@postgres:5432/beacon
      REDIS_URL: redis://redis:6379
      BCN: /app/tooling/.venv/bin/bcn
      # Video is fetched from the bucket into BCN_SCRATCH for the length of one job (compose) and
      # deleted afterwards. Credentials are the same AWS_* the api uses.
      S3_MEDIA_BUCKET: ${S3_MEDIA_BUCKET:-}
      S3_MEDIA_PREFIX: ${S3_MEDIA_PREFIX:-media}
      S3_MEDIA_REGION: ${S3_MEDIA_REGION:-}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-us-east-1}
      BCN_SCRATCH: /data/scratch
    volumes:
      - programme-root:/data/programme
      - media-scratch:/data/scratch
      # api writes pasted/edited/uploaded text here (its dataDir) before enqueueing a job
      # with an absolute path to it — the worker that actually runs the job needs the same
      # volume at the same path, or intake/edit jobs fail with FS_MISSING.
      - ui-state:/data/ui-state
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      replicas: 2
      resources:
        limits:
          # ffmpeg threads to use every core it can get; capping each worker replica keeps
          # both from oversubscribing the host's 2 vCPUs and starving postgres/redis/ssh
          # (both replicas combined can take at most 1.5 of 2 cores).
          cpus: "0.75"
          memory: 768M

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: beacon
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-beacon}
      POSTGRES_DB: beacon
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U beacon"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  backup:
    # Built from the repo root. Nightly: pg_dump to S3, plus an `aws s3 sync` mirror of the
    # programme volume (content, assets, master video, theme, state) and a small version
    # manifest — see deploy/backup/backup.sh. Point-in-time recovery needs
    # deploy/backup/setup-bucket.sh run once against the bucket first (bucket versioning +
    # lifecycle), with broader credentials than this container's own.
    build:
      context: .
      dockerfile: deploy/backup/Dockerfile
    init: true
    environment:
      BEACON_ROOT: /data/programme
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-beacon}
      S3_BACKUP_BUCKET: ${S3_BACKUP_BUCKET:-}
      S3_BACKUP_PREFIX: ${S3_BACKUP_PREFIX:-postgres}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-14}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-us-east-1}
    volumes:
      - programme-root:/data/programme
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  programme-root:
  ui-state:
  media-scratch:   # worker scratch for videos fetched from S3 during a job; always emptied afterwards
  postgres-data:
  redis-data:
  caddy-data:
  caddy-config:
