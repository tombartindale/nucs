<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Delivery Runway mockup</title>
<style>
:root {
  --bg: #f6f6f4; --card: #fff; --ink: #1d1d1b; --ink2: #5c5c58; --ink3: #8d8d88; --line: #e2e2de; --line2: #cfcfca;
  --bar: #d9d9d4; --bar-ink: #3b3b38; --rec: #4a4a46; --done: #b9b9b3; --weekend: #efefeb;
  --red: #c62828; --red-bg: #fdecec; --amber: #b26a00; --amber-bg: #fff4e0;
  font: 13px/1.4 -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; color: var(--ink);
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); }
.appbar { display: flex; align-items: center; gap: 4px; background: #2b2b29; color: #fff; padding: 0 16px; height: 44px; }
.appbar .brand { font-weight: 700; margin-right: 20px; }
.appbar .nav { padding: 12px 12px; color: #c9c9c4; border-bottom: 2px solid transparent; }
.appbar .nav.on { color: #fff; border-bottom-color: #fff; }
.appbar .sp { flex: 1; }
.appbar .jobs { font-size: 12px; color: #c9c9c4; border: 1px solid #555; border-radius: 3px; padding: 2px 8px; }
.mockbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding: 10px 16px; background: #fff; border-bottom: 1px solid var(--line); }
.mockbar .lbl { color: var(--ink3); font-size: 12px; margin-right: 4px; }
button { font: inherit; border: 1px solid var(--line2); background: #fff; border-radius: 4px; padding: 4px 10px; cursor: pointer; color: var(--ink); }
button.on { background: var(--ink); color: #fff; border-color: var(--ink); }
.toggle { display: inline-flex; gap: 6px; align-items: center; margin-left: auto; font-size: 12px; color: var(--ink2); border: 1px dashed var(--line2); padding: 4px 8px; border-radius: 4px; }
main { padding: 16px; }
.screen { display: none; }
.screen.on { display: block; }
h1 { font-size: 20px; margin: 0; }
h2 { font-size: 14px; margin: 0 0 6px; }
.crumbs { color: var(--ink3); font-size: 12px; margin-bottom: 4px; }
.crumbs a { color: var(--ink2); }
.pagehead { display: flex; align-items: flex-end; gap: 16px; flex-wrap: wrap; margin-bottom: 12px; }
.pagehead .sub { color: var(--ink2); }
.pagehead .tools { margin-left: auto; display: flex; gap: 6px; align-items: center; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 6px; }
.headline { display: flex; gap: 0; margin-bottom: 12px; }
.headline > div { flex: 1; padding: 10px 14px; border-right: 1px solid var(--line); }
.headline > div:last-child { border-right: 0; }
.headline .v { font-size: 22px; font-weight: 700; }
.headline .l { color: var(--ink2); font-size: 12px; }
.red { color: var(--red); } .amber { color: var(--amber); } .muted { color: var(--ink3); }
.tabs { display: flex; gap: 0; border-bottom: 1px solid var(--line); margin-bottom: 12px; }
.tabs span { padding: 6px 14px; color: var(--ink2); border-bottom: 2px solid transparent; }
.tabs span.on { color: var(--ink); border-bottom-color: var(--ink); font-weight: 600; }

/* runway */
.rw-scroll { overflow-x: auto; }
.rw { position: relative; }
.rw .row { position: relative; border-bottom: 1px solid var(--line); }
.rw .row.sub { border-bottom: 1px dotted var(--line); }
.rw .row.lanehead { border-top: 1px solid var(--line2); }
.rw .lab { position: absolute; left: 0; top: 0; bottom: 0; padding: 3px 10px; background: #fff; z-index: 3; border-right: 1px solid var(--line); overflow: hidden; }
.rw .lab .t { font-weight: 600; }
.rw .lab .s { font-size: 11px; color: var(--ink2); white-space: nowrap; }
.rw .lang { position: absolute; background: rgba(255,255,255,.85); padding: 0 2px; font-size: 10px; font-weight: 700; color: var(--ink3); letter-spacing: .04em; z-index: 3; }
.wk { position: absolute; top: 0; bottom: 0; background: var(--weekend); z-index: 0; }
.gridline { position: absolute; top: 0; bottom: 0; border-left: 1px solid #ececea; z-index: 0; }
.axis { position: relative; height: 36px; border-bottom: 1px solid var(--line2); background: #fff; }
.axis .m { position: absolute; top: 2px; font-size: 11px; font-weight: 700; color: var(--ink2); }
.axis .d { position: absolute; top: 18px; font-size: 10px; color: var(--ink3); transform: translateX(-50%); white-space: nowrap; }
.today { position: absolute; top: 0; bottom: 0; width: 0; border-left: 2px solid var(--ink); z-index: 6; pointer-events: none; }
.today b { position: absolute; top: -1px; left: -1px; background: var(--ink); color: #fff; font-size: 10px; padding: 1px 5px; white-space: nowrap; border-radius: 0 3px 3px 0; }
.bar { position: absolute; height: 14px; border-radius: 2px; font-size: 10px; line-height: 14px; padding: 0 3px; overflow: hidden; white-space: nowrap; z-index: 2; }
.bar.scripts { background: var(--bar); color: var(--bar-ink); border: 1px solid #c4c4be; }
.bar.rec { background: var(--rec); color: #fff; }
.bar.now { outline: 2px solid var(--ink); outline-offset: 1px; }
.bar.over { background: var(--red-bg); color: var(--red); border: 1px solid var(--red); }
.bar.rec.over { background: var(--red); color: #fff; }
.bar.zhout { background: repeating-linear-gradient(90deg, #e8e8e4 0 6px, #f3f3f0 6px 8px); border: 1px solid #c4c4be; color: var(--bar-ink); }
.bar.zhout.over { border-color: var(--red); color: var(--red); background: var(--red-bg); }
.bar.open { background: transparent; border: 1px dashed var(--ink3); color: var(--ink3); }
.bar.prop { background: transparent; border: 1px dashed #77776f; color: var(--ink2); }
.bar.prop.over { border-color: var(--red); color: var(--red); }
.bar.tail { background: repeating-linear-gradient(135deg, transparent 0 4px, #e3e3df 4px 6px); border: 1px solid var(--line2); color: var(--ink2); }
.bar.float { background: repeating-linear-gradient(90deg, #f0f0ed 0 2px, transparent 2px 5px); border: 1px dotted var(--line2); color: var(--ink3); height: 10px; line-height: 10px; }
.bar.blk { background: var(--red-bg); color: var(--red); border: 1px solid var(--red); }
.tick { position: absolute; width: 2px; height: 12px; background: var(--done); z-index: 2; }
.tickl { position: absolute; font-size: 9px; color: var(--ink3); z-index: 2; white-space: nowrap; }
.dia { position: absolute; width: 11px; height: 11px; transform: rotate(45deg); z-index: 4; }
.dia.deliv { background: var(--ink); }
.dia.proj { border: 2px solid var(--ink); background: #fff; }
.dia.proj.over { border-color: var(--red); }
.dia.ms { background: #fff; border: 1.5px solid var(--ink2); width: 9px; height: 9px; }
.bracket { position: absolute; height: 0; border-top: 1.5px solid var(--ink2); z-index: 3; }
.bracket.over { border-top: 2px solid var(--red); }
.bracket span { position: absolute; top: 2px; left: 50%; transform: translateX(-50%); font-size: 10px; font-weight: 700; white-space: nowrap; background: rgba(255,255,255,.85); padding: 0 2px; }
.flag { position: absolute; font-size: 10px; padding: 0 4px; border-radius: 2px; z-index: 5; white-space: nowrap; line-height: 14px; }
.flag.blocked { background: var(--red); color: #fff; }
.flag.stale { background: var(--amber); color: #fff; }
.flag.gap { border: 1px dashed var(--ink3); color: var(--ink2); background: #fff; }
.flag.over { border: 1px solid var(--red); color: var(--red); background: #fff; }
.flag.plain { color: var(--ink2); background: #fff; border: 1px solid var(--line2); }
.edge { position: absolute; font-size: 10px; color: var(--ink2); z-index: 4; white-space: nowrap; background: #fff; padding: 0 3px; }
.vline { position: absolute; top: 0; bottom: 0; width: 0; border-left: 1px dashed var(--ink3); z-index: 1; }
.vline.deliv { border-left: 2px solid var(--ink2); }
.vline span { position: absolute; top: 2px; left: 3px; font-size: 10px; color: var(--ink2); white-space: nowrap; background: rgba(246,246,244,.9); }
.chip { display: inline-block; font-size: 11px; border: 1px solid var(--line2); border-radius: 10px; padding: 0 7px; margin: 1px 2px 1px 0; white-space: nowrap; color: var(--ink2); background: #fff; }
.chip.ok { color: var(--ink3); text-decoration: line-through; }
.chip.need { color: var(--ink); border-color: var(--ink3); }
.chip.blocked { background: var(--red); border-color: var(--red); color: #fff; }
.chip.stale { background: var(--amber); border-color: var(--amber); color: #fff; }
.chip.over { color: var(--red); border-color: var(--red); }
.lanegroup { position: relative; z-index: 7; font-size: 11px; font-weight: 700; color: var(--ink2); text-transform: uppercase; letter-spacing: .05em; padding: 10px 10px 4px; background: var(--bg); border-bottom: 1px solid var(--line2); }
.slice { margin-top: 12px; display: grid; grid-template-columns: 220px 1fr; }
.slice .h { padding: 10px; border-right: 1px solid var(--line); }
.slice ul { margin: 0; padding: 8px 14px; list-style: none; columns: 2; column-gap: 28px; }
.slice li { padding: 3px 0; break-inside: avoid; }
.legend { display: flex; flex-wrap: wrap; gap: 14px; font-size: 11px; color: var(--ink2); margin: 10px 2px; align-items: center; }
.legend i { display: inline-block; vertical-align: middle; margin-right: 4px; position: static; }
.note { font-size: 12px; color: var(--ink2); background: #fff; border-left: 3px solid var(--ink3); padding: 6px 10px; margin: 10px 0; }
.note.gap { border-left-style: dashed; }
.sidebox { display: grid; grid-template-columns: minmax(0, 1fr) 280px; gap: 12px; align-items: start; }
.session dl { display: grid; grid-template-columns: 110px 1fr; margin: 0; gap: 4px 8px; font-size: 12px; }
.session dt { color: var(--ink2); }
.session dd { margin: 0; }
.session .acts { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
.load .cell { position: absolute; bottom: 0; background: #cdcdc7; z-index: 1; }
.load .cell.over { background: var(--red); }
.load .cap { position: absolute; left: 0; right: 0; border-top: 1px dashed var(--ink3); z-index: 2; }
.load .rc { position: absolute; top: 2px; font-size: 9px; z-index: 2; color: var(--ink2); }
.load .rc.over { color: var(--red); font-weight: 700; }
a { color: inherit; }
</style>
</head>
<body>
<div class="appbar">
  <span class="brand">NU Content Studio</span>
  <span class="nav on">Runway</span><span class="nav">Verification</span><span class="nav">Translation</span><span class="nav">Intake</span>
  <span class="sp"></span><span class="jobs">Jobs · 1 running ▾</span>
</div>
<div class="mockbar">
  <span class="lbl">Mockup screens:</span>
  <button data-s="s1" class="on">1 · Programme runway (landing)</button>
  <button data-s="s2">2 · Module runway · KV7015</button>
  <button data-s="s3">3 · Unit runway · KV7015 U05</button>
  <label class="toggle"><input type="checkbox" id="zhprop"> Preview proposed ZH back-schedule (needs new data, see concept.md)</label>
</div>
<main>
  <section id="s1" class="screen on"></section>
  <section id="s2" class="screen"></section>
  <section id="s3" class="screen"></section>
</main>
<script>
const DAY = 86400000;
const d2n = (s) => Math.round(Date.parse(s + 'T00:00:00Z') / DAY);
const n2d = (n) => new Date(n * DAY).toISOString().slice(0, 10);
const TODAY = d2n('2026-10-11');
const BRIEF_MIN = 20, REC_MULT = 1.5, HOURS = 3, DEF_MIN = 40;
// Proposed ZH tail (data gap: none of these exist today)
const ZH = { edit: 3, turnaround: 10, fix: 1, pkg: 1 };
const ZH_TAIL = ZH.edit + ZH.turnaround + ZH.fix + ZH.pkg;

// u: [code, title, topics, drafted, recorded, minutesEach, enPost, zh, recordedOn]
const U = (code, title, n, dr, rec, m, en = '', zh = 'ns', recOn = null, flags = {}) => ({ code, title, n, dr, rec, m, en, zh, recOn, ...flags });
const MODULES = [
  { id: 'KV7015', title: 'Research Methods', delivery: '2026-10-30', owner: 'Tom B.', units: [
    U('U01', 'Asking questions', 10, 10, 10, 8, 'pk10', 'par10', '2026-09-08'),
    U('U02', 'Reading evidence', 10, 10, 10, 8, 'pk10', 'out10:2026-09-29', '2026-09-15'),
    U('U03', 'Designing studies', 10, 10, 10, 7, 'cu7', 'ns', '2026-09-24'),
    U('U04', 'Sampling', 10, 10, 0, 7, '', 'ns', null, { blocked: 1, stale: 1 }),
    U('U05', 'Measurement', 10, 6, 0, 6, '', 'ns', null, { blocked: 1, stale: 1 }),
    U('U06', 'Qualitative data', 10, 0, 0, 7),
    U('U07', 'Synthesis', 10, 0, 0, 8),
    U('U08', 'Reporting', 10, 0, 0, 6) ] },
  { id: 'KV7016', title: 'Data Analysis', delivery: '2026-10-14', owner: 'Tom B.', units: [
    U('U01', 'Describing data', 10, 10, 10, 7, 'pk10', 'ret10', '2026-08-25'),
    U('U02', 'Distributions', 10, 10, 10, 7, 'pk10', 'out10:2026-09-15', '2026-09-01'),
    U('U03', 'Estimation', 10, 10, 10, 8, 'pk10', 'out10:2026-09-15', '2026-09-10'),
    U('U04', 'Testing', 10, 10, 10, 8, 'cu10', 'ns', '2026-09-22'),
    U('U05', 'Regression', 10, 10, 0, 8),
    U('U06', 'Categorical outcomes', 10, 4, 0, 7, '', 'ns', null, { blocked: 2 }),
    U('U07', 'Repeated measures', 10, 0, 0, 7),
    U('U08', 'Reporting results', 10, 0, 0, 6) ] },
  { id: 'KV7017', title: 'Research Ethics', delivery: '2026-12-11', owner: 'Tom B.', units: [
    U('U01', 'Why ethics', 10, 10, 0, 6),
    U('U02', 'Consent', 10, 0, 0, 6), U('U03', 'Risk and harm', 10, 0, 0, 7), U('U04', 'Data protection', 10, 0, 0, 7),
    U('U05', 'Vulnerable groups', 10, 0, 0, 6), U('U06', 'Online research', 10, 0, 0, 6), U('U07', 'Review boards', 10, 0, 0, 5), U('U08', 'Integrity', 10, 0, 0, 6) ] },
  { id: 'KV7018', title: 'Qualitative Inquiry', delivery: '2026-10-23', owner: 'Tom B.', units: [
    U('U01', 'Paradigms', 10, 10, 10, 7, 'pk10', 'out10:2026-10-02', '2026-09-03'),
    U('U02', 'Interviewing', 10, 10, 10, 8, 'cu10', 'ns', '2026-09-17'),
    U('U03', 'Focus groups', 10, 10, 0, 7, '', 'ns', null, { stale: 2 }),
    U('U04', 'Observation', 10, 10, 0, 7),
    U('U05', 'Coding', 10, 3, 0, 8),
    U('U06', 'Thematic analysis', 10, 0, 0, 8),
    U('U07', 'Rigour', 10, 0, 0, 6), U('U08', 'Writing up', 10, 0, 0, 6) ] },
  { id: 'KV7019', title: 'Applied Statistics II', delivery: '2027-01-15', owner: 'Tom B.', units:
    ['Models', 'GLMs', 'Mixed models', 'Survival', 'Missing data', 'Bayes', 'Power', 'Reporting'].map((t, i) => U(`U0${i + 1}`, t, 10, 0, 0, 7)) },
  { id: 'KV7020', title: 'Systematic Reviews', delivery: '2026-10-23', owner: 'Tom B.', units: [
    U('U01', 'Protocols', 10, 10, 10, 7, 'pk10', 'out10:2026-09-15', '2026-07-21'),
    U('U02', 'Searching', 10, 10, 10, 7, 'pk10', 'out10:2026-09-15', '2026-07-28'),
    U('U03', 'Screening', 10, 10, 10, 7, 'pk10', 'out10:2026-09-15', '2026-08-04'),
    U('U04', 'Extraction', 10, 10, 10, 7, 'pk10', 'out10:2026-09-15', '2026-08-11'),
    U('U05', 'Risk of bias', 10, 10, 10, 8, 'pk10', 'ret10', '2026-08-18', { zhBlocked: 3 }),
    U('U06', 'Meta-analysis', 10, 10, 10, 8, 'pk10', 'ret10', '2026-08-25', { zhBlocked: 1 }),
    U('U07', 'GRADE', 10, 10, 10, 6, 'cu10', 'ns', '2026-09-01'),
    U('U08', 'Reporting', 10, 10, 10, 6, 'cu8', 'ns', '2026-09-08', { stale: 1 }) ] },
  { id: 'KV7021', title: 'Dissertation Skills', delivery: null, owner: '', units:
    ['Choosing a topic', 'Proposals', 'Supervision', 'Literature', 'Methods chapter', 'Results', 'Discussion', 'Viva'].map((t, i) => U(`U0${i + 1}`, t, 10, i < 2 ? 10 : (i === 2 ? 2 : 0), 0, 6)) },
  { id: 'KV7022', title: 'Academic Writing', delivery: null, owner: '', units:
    ['Voice', 'Argument', 'Paragraphs', 'Citing', 'Editing', 'Feedback', 'Abstracts', 'Publishing'].map((t, i) => U(`U0${i + 1}`, t, 10, 0, 0, 5)) },
];

function tasksFor(mod) {
  const t = [];
  for (const u of mod.units) {
    const nd = u.n - u.dr, nr = u.n - u.rec;
    if (nd > 0) t.push({ unit: u.code, kind: 'scripts', count: nd, min: nd * BRIEF_MIN });
    if (nr > 0) t.push({ unit: u.code, kind: 'recording', count: nr, min: nr * (u.m || DEF_MIN) * REC_MULT });
  }
  return t;
}
const costOf = (t) => (t.kind === 'recording' ? 1 : t.min / 60 / HOURS);
// Port of computeModulePlan's backward walk; shift moves the anchor earlier (ZH proposal).
function planFor(mod, shift = 0) {
  const tasks = tasksFor(mod);
  tasks.forEach((t) => { t.cost = costOf(t); });
  if (!mod.delivery) {
    // Undated: forward ASAP projection from today, same costs (proposal, not in planning.ts)
    let acc = 0;
    for (const t of tasks) { acc += t.cost; t.due = TODAY + Math.ceil(acc) - 1; }
    return { tasks, dated: false, asapEnd: tasks.length ? tasks[tasks.length - 1].due : TODAY, workDays: acc };
  }
  let cursor = d2n(mod.delivery) - shift, acc = 0;
  for (let i = tasks.length - 1; i >= 0; i--) {
    acc += tasks[i].cost;
    const w = Math.floor(acc);
    if (w > 0) { cursor -= w; acc -= w; }
    tasks[i].due = cursor;
  }
  const earliest = tasks.length ? Math.min(...tasks.map((t) => t.due)) : null;
  const float = earliest === null ? null : earliest - TODAY; // negative = daysBehind
  return { tasks, dated: true, earliest, float, daysBehind: float !== null && float < 0 ? -float : 0,
    onTrack: earliest === null || earliest >= TODAY, delivery: d2n(mod.delivery), anchor: d2n(mod.delivery) - shift };
}
// ---------- view helpers ----------
const DOW = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
const MON = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
const dt = (n) => new Date(n * DAY);
const fmt = (n) => `${dt(n).getUTCDate()} ${MON[dt(n).getUTCMonth()]}`;
const fmtD = (n) => `${DOW[dt(n).getUTCDay()]} ${fmt(n)}`;
const fmtMin = (m) => (m < 60 ? `${Math.round(m)} min` : `${Math.floor(m / 60)}h${Math.round(m % 60) ? ' ' + Math.round(m % 60) + 'm' : ''}`);
const pl = (n, w) => `${n} ${w}${n === 1 ? '' : 's'}`;
const esc = (s) => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/"/g, '&quot;');
let PROP = false;

function TL(start, end, ppd, labW) {
  return { start, end, ppd, labW, x: (n) => labW + (n - start) * ppd, w: labW + (end - start) * ppd };
}
function axis(t) {
  let h = `<div class="axis" style="width:${t.w}px"><div class="lab" style="width:${t.labW}px"><span class="s">${PROP ? 'with proposed ZH tail' : 'from planning.ts, as today'}</span></div>`;
  for (let n = t.start; n < t.end; n++) {
    const d = dt(n);
    if (d.getUTCDate() === 1 || (n === t.start && d.getUTCDate() < 26)) h += `<span class="m" style="left:${t.x(n) + 3}px">${MON[d.getUTCMonth()]} ${d.getUTCFullYear()}</span>`;
    if (d.getUTCDay() === 1 || t.ppd >= 20) h += `<span class="d" style="left:${t.x(n) + t.ppd / 2}px;${d.getUTCDay() === 1 && t.ppd >= 20 ? 'font-weight:700;color:#5c5c58' : ''}">${t.ppd >= 20 && d.getUTCDay() === 1 ? 'Mo ' : ''}${d.getUTCDate()}</span>`;
  }
  return h + '</div>';
}
function bg(t, top) {
  let h = `<div style="position:absolute;left:0;top:${top}px;bottom:0;width:${t.w}px;pointer-events:none">`;
  for (let n = t.start; n < t.end; n++) {
    const d = dt(n).getUTCDay();
    if (d === 0 || d === 6) h += `<div class="wk" style="left:${t.x(n)}px;width:${t.ppd}px"></div>`;
    if (d === 1) h += `<div class="gridline" style="left:${t.x(n)}px"></div>`;
  }
  h += '</div>';
  if (TODAY >= t.start && TODAY < t.end) h += `<div class="today" style="left:${t.x(TODAY)}px;top:${top - 14}px"><b>today ${fmtD(TODAY)}</b></div>`;
  return h;
}
// a bar from day s (inclusive) to e (exclusive), clipped to the window
function bar(t, s, e, cls, text, top, title = '', align = 'right') {
  const s2 = Math.max(s, t.start), e2 = Math.min(e, t.end);
  if (e2 <= t.start || s2 >= t.end) return '';
  const left = t.x(s2), w = Math.max((e2 - s2) * t.ppd, 3);
  const fits = text && text.length * 5.6 + 6 < w;
  return `<div class="bar ${cls}" title="${esc(title || text)}" style="left:${left}px;width:${w}px;top:${top}px">${fits ? text : ''}</div>`
    + (!fits && text ? (align === 'left' ? `<span class="tickl" style="left:${left - 3}px;transform:translateX(-100%);top:${top + 1}px">${text}</span>` : `<span class="tickl" style="left:${left + w + 3}px;top:${top + 1}px">${text}</span>`) : '');
}
const flag = (t, n, cls, text, top, dx = 0, title = '') => (n < t.start || n > t.end ? '' :
  `<span class="flag ${cls}" title="${esc(title || text)}" style="left:${t.x(n) + dx}px;top:${top}px">${text}</span>`);
function dia(t, n, cls, top, title) {
  if (n < t.start || n > t.end) return '';
  return `<span class="dia ${cls}" title="${esc(title)}" style="left:${t.x(n) - 5}px;top:${top}px"></span>`;
}
function bracket(t, a, b, top, label, over) {
  const l = t.x(Math.max(Math.min(a, b), t.start)), r = t.x(Math.min(Math.max(a, b), t.end));
  if (r <= l) return '';
  return `<div class="bracket ${over ? 'over' : ''}" style="left:${l}px;width:${r - l}px;top:${top}px"><span class="${over ? 'red' : ''}">${label}</span></div>`;
}
function markers(t, list) {
  let h = `<div class="row" style="height:40px"><div class="lab" style="width:${t.labW}px"><div class="t">Milestones</div><div class="s">from planning.ts milestones</div></div>`;
  list.forEach(([n, label, strong, left], i) => { if (n >= t.start && n <= t.end) h += `<span class="flag ${strong ? 'plain' : 'gap'}" style="left:${t.x(n) + (left ? 1 : -1)}px;top:${3 + (i % 2) * 18}px;${left ? 'transform:translateX(-100%);' : ''}${strong ? 'font-weight:700' : ''}">${label}</span>`; });
  return h + '</div>';
}
const taskBox = (task) => (task.kind === 'recording' ? [task.due, task.due + 1] : [task.due + 1 - Math.max(task.cost, 0.3), task.due + 1]);
const taskCls = (task) => {
  const [s, e] = taskBox(task);
  return `${task.kind === 'recording' ? 'rec' : 'scripts'}${task.due < TODAY ? ' over' : ''}${s <= TODAY && TODAY < e ? ' now' : ''}`;
};
const unitOf = (m, code) => m.units.find((u) => u.code === code);
const enCued = (u) => /^(cu|pk)/.test(u.en);
function zhState(u) {
  const m = /^(out|ret|par|pk|ns)(\d*)(?::(.*))?$/.exec(u.zh);
  return { kind: m[1], since: m[3] ? d2n(m[3]) : null };
}
// Proposed ZH projection per unit (data gap: zh_turnaround_days, edit_days do not exist yet)
function zhProjection(m, p) {
  const out = [];
  for (const u of m.units) {
    const z = zhState(u);
    const rec = p.tasks.find((x) => x.unit === u.code && x.kind === 'recording');
    let exp = null, ret = null, end = null, note = '';
    if (z.kind === 'pk' || z.kind === 'par') { end = TODAY + (z.kind === 'par' ? ZH.pkg : 0); note = 'parity checked'; }
    else if (z.kind === 'ret') { end = TODAY + ZH.fix + ZH.pkg; note = 'returned'; }
    else if (z.kind === 'out') { exp = z.since; ret = Math.max(z.since + ZH.turnaround, TODAY + 1); end = ret + ZH.fix + ZH.pkg; }
    else if (rec) { exp = rec.due + (p.daysBehind || 0) + 1 + ZH.edit; ret = exp + ZH.turnaround; end = ret + ZH.fix + ZH.pkg; }
    else { exp = TODAY + (enCued(u) ? 0 : ZH.edit); ret = exp + ZH.turnaround; end = ret + ZH.fix + ZH.pkg; }
    out.push({ unit: u.code, exp, ret, end, recDue: rec ? rec.due : null, kind: z.kind, since: z.since, note });
  }
  return out;
}
const groupRange = (codes) => (codes.length > 1 ? `${codes[0]}–${codes[codes.length - 1]}` : codes[0]);

    }
    // ZH
    if (z.kind === 'out') {
      rows += bar(t, z.since, TODAY, `zhout ${PROP && TODAY - z.since > ZH.turnaround ? 'over' : ''}`, `out ${TODAY - z.since}d`, EN + 4);
      if (!PROP) rows += bar(t, TODAY, TODAY + 4, 'open', '? no return date', EN + 4);
    }
    if (z.kind === 'par') rows += flag(t, TODAY, 'plain', 'parity ✓ · render + package ZH', EN + 3, 4);
    if (z.kind === 'ns' && enCued(u) && !PROP) rows += flag(t, TODAY, 'plain', 'cue 3 more, then send', EN + 3, 4);
    if (PROP && zp.kind !== 'par') {
      const over = zp.end > p.delivery;
      if (zp.kind !== 'out') rows += bar(t, zp.exp - (zp.recDue !== null ? ZH.edit : 0), zp.exp, 'prop', 'edit', EN + 4);
      if (zp.kind !== 'out') rows += bar(t, zp.exp, zp.ret, `prop ${over ? 'over' : ''}`, `translator ${ZH.turnaround}d`, EN + 4);
      rows += bar(t, zp.ret, zp.end, `prop ${over ? 'over' : ''}`, 'fix·pkg', EN + 4);
    } else if (!PROP && !u.recOn) rows += flag(t, Math.max(...tasks.map((k) => k.due)) + 1, 'gap', 'ZH: no date', EN + 3, 4);
    rows += '</div>';
  }
  const vl = (n, cls, label, dy = 0) => (n >= t.start && n <= t.end ? `<div class="vline ${cls}" style="left:${t.x(n)}px;top:${AX}px">${label ? `<span style="top:${2 + dy}px">${label}</span>` : ''}</div>` : '');
  const lines = vl(briefsDue + 1, '', '') + vl(recDue + 1, '', '') + vl(p.delivery, 'deliv', '');
  h += `<div class="card rw-scroll"><div class="rw" style="width:${t.w}px">${axis(t)}${bg(t, AX)}${lines}${rows}</div></div>`;
  h += `<div class="note">Read it like this: bars left of the black line that are still drawn are late; the bracket on the top row is the module's float. The chain is strictly serial (one producer, one unit at a time), so <b>every outstanding task is on the critical path</b> and they all share the same float. A slip anywhere moves everything to its right.</div>`;
  h += `<div class="note gap"><b>Things the geometry exposes in today's plan:</b> U05's scripts and its recording are both due ${fmtD(rc.find((k) => k.unit === 'U05').due)} (the 4 scripts cost under a day, so the backward walk never steps back). U06's session lands on ${fmtD(rc.find((k) => k.unit === 'U06').due)}: the plan has no working calendar. U08 records the day before delivery, which leaves 0 days for edit, cues, package and all of ZH.</div>`;
  return h;
}

// ---------- screen 3: unit runway ----------
function screen3() {
  const m = MODULES.find((x) => x.id === 'KV7015'), u = unitOf(m, 'U05');
  const p = planFor(m, 0), pz = planFor(m, ZH_TAIL);
  const recZ = pz.tasks.find((k) => k.unit === 'U05' && k.kind === 'recording');
  const rec = p.tasks.find((k) => k.unit === 'U05' && k.kind === 'recording');
  const scr = p.tasks.find((k) => k.unit === 'U05' && k.kind === 'scripts');
  const t = TL(d2n('2026-10-09'), d2n('2026-11-09'), 25, 360);
  const S = rec.due;
  // topic needs before the session: written → validated (fresh, passing) → recording script (fresh)
  const TOP = [
    ['T01', 'Operationalising concepts', 6, ['ok', 'ok', 'ok']],
    ['T02', 'Scales and indices', 6, ['ok', 'ok', 'ok']],
    ['T03', 'Likert items', 5, ['ok', 'ok', 'stale']],
    ['T04', 'Validity', 7, ['ok', 'blocked', 'need']],
    ['T05', 'Reliability coefficients', 6, ['ok', 'need', 'need']],
    ['T06', 'Measurement error', 6, ['ok', 'ok', 'need']],
    ['T07', 'Standardised instruments', 6, ['need', 'need', 'need']],
    ['T08', 'Translating instruments', 6, ['need', 'need', 'need']],
    ['T09', 'Pilot testing', 6, ['need', 'need', 'need']],
    ['T10', 'Reporting measures', 6, ['need', 'need', 'need']],
  ];
  const STEP = ['write', 'validate', 'rec. script'];
  const ready = TOP.filter((x) => x[3].every((s) => s === 'ok')).length;
  const content = TOP.reduce((a, x) => a + x[2], 0);
  let h = `<div class="crumbs"><a href="#" onclick="go('s1');return false">Runway</a> › <a href="#" onclick="go('s2');return false">KV7015</a> › U05</div>
    <div class="pagehead"><div><h1>U05 · Measurement</h1><div class="sub">Recording session <b>${fmtD(S)}</b> (${S - TODAY} days) · scripts due <b>${fmtD(scr.due)}</b> · shares KV7015's <b>${p.float}d float</b>${PROP ? ` · <b class="red">with the proposed ZH tail this session was due ${fmtD(recZ.due)}: the ZH bars below land after delivery</b>` : ''}</div></div></div>`;
  h += '<div class="sidebox"><div>';
  const AX = 36, RH = 46;
  let rows = markers(t, [[S, `● session ${fmtD(S)}`, true], [p.delivery, `◆ module delivery ${fmt(p.delivery)}`, true]]);
  rows += `<div class="row" style="height:58px"><div class="lab" style="width:${t.labW}px"><div class="t">Unit U05</div><div class="s">prep → one session → post-production</div><div class="s">${ready} of 10 topics ready to record</div></div>`;
  rows += bar(t, TODAY, scr.due + 1, scr.due < TODAY ? 'over' : 'float', `prep window: ${scr.due - TODAY + 1} days to make 10 topics ready`, 9);
  rows += bar(t, S, S + 1, `rec ${S < TODAY ? 'over' : ''}`, '●', 7);
  if (PROP) {
    const ex = S + 1 + ZH.edit, rt = ex + ZH.turnaround, en = rt + ZH.fix + ZH.pkg;
    rows += bar(t, S + 1, ex, 'prop', 'EN edit', 6) + bar(t, ex, ex + 1, 'prop', 'cues·pkg', 6)
      + bar(t, ex, rt, `prop ${en > p.delivery ? 'over' : ''}`, `ZH with translator ${ZH.turnaround}d`, 26) + bar(t, rt, en, `prop ${en > p.delivery ? 'over' : ''}`, 'fix·pkg', 26);
  } else {
    rows += bar(t, S + 1, S + 8, 'tail', 'EN: edit → cues → package · undated', 6) + bar(t, S + 1, S + 8, 'open', 'ZH: export → translator → parity · undated', 26);
  }
  rows += '</div>';
  for (const [code, title, min, st] of TOP) {
    const isBlocked = st.includes('blocked'), isStale = st.includes('stale');
    const allOk = st.every((s) => s === 'ok');
    const chips = st.map((s, i) => `<span class="chip ${s === 'ok' ? 'ok' : s}">${STEP[i]}${s === 'blocked' ? ': 1,180 words, max 960' : s === 'stale' ? ': older than topic.md' : ''}</span>`).join('');
    rows += `<div class="row" style="height:${RH}px"><div class="lab" style="width:${t.labW}px"><div><b>${code}</b> ${title} <span class="muted">${min} min</span></div><div>${chips}</div></div>`;
    if (allOk) rows += flag(t, TODAY, 'plain', '✓ ready', 9, 4);
    else {
      // remaining prep, docked against the scripts deadline (the slot planning.ts gives it)
      const work = st[0] === 'need' ? BRIEF_MIN : 0;
      const e = Math.min(scr.due + 1, S), s = e - Math.max(work / 60 / HOURS, 0.25);
      rows += bar(t, TODAY, s, 'float', '', 12, 'float: could be done any day in here');
      rows += bar(t, s, e, isBlocked ? 'blk' : (scr.due < TODAY ? 'over' : 'scripts'), work ? `${work}m` : '', 9, work ? 'write: 20 min estimate' : 'validate / script: minutes', 'left');
      if (isBlocked) rows += flag(t, TODAY, 'blocked', '▲ needs you: word count over · not estimated', 9, 4);
      if (isStale) rows += flag(t, TODAY, 'stale', '◆ re-run Recording script', 9, 4);
    }
    rows += bar(t, S, S + 1, `rec ${S < TODAY ? 'over' : ''}`, '●', 9);
    rows += '</div>';
  }
  const vl = (n, cls) => `<div class="vline ${cls}" style="left:${t.x(n)}px;top:${AX}px"></div>`;
  h += `<div class="card rw-scroll"><div class="rw" style="width:${t.w}px">${axis(t)}${bg(t, AX)}${vl(S, '', '')}${vl(p.delivery, 'deliv', '')}${rows}</div></div>`;
  h += `<div class="note">Each topic's remaining prep is docked against the slot planning.ts gives the unit's scripts (${fmtD(scr.due)}); the dotted band to its left is the slack it can use. Steps are what <code>bcn status</code> already reports (stage, stale, blocked). Nothing here is computed by the UI except placing them on the calendar.</div></div>`;
  // session sheet
  h += `<div class="card session" style="padding:12px"><h2>Session sheet</h2><dl>
    <dt>Date</dt><dd><b>${fmtD(S)}</b> (planned, not booked)</dd>
    <dt>Topics</dt><dd>10 · ${content} min of content</dd>
    <dt>Session length</dt><dd>~${fmtMin(content * REC_MULT)} (1.5× content)</dd>
    <dt>Ready now</dt><dd>${ready} / 10</dd>
    <dt>Prep left</dt><dd>4 scripts to write (1h20) · 2 to validate · 1 blocked · 4 recording scripts</dd>
    <dt>After session</dt><dd class="muted">EN post-production and ZH have no dates yet</dd></dl>
    <div class="acts"><button>Intake U05 scripts</button><button>Validate U05</button><button>Recording script (U05)</button><button>Teleprompter</button><button>Fix T04 in editor</button></div>
    <div class="muted" style="font-size:11px;margin-top:8px">Each button queues the existing bcn job for unit scope, with the usual confirm dialog. Progress shows in the Jobs tray.</div></div>`;
  h += '</div>';
  return h;
}

function render() {
  document.getElementById('s1').innerHTML = screen1();
  document.getElementById('s2').innerHTML = screen2();
  document.getElementById('s3').innerHTML = screen3();
}
function go(id) {
  document.querySelectorAll('.screen').forEach((s) => s.classList.toggle('on', s.id === id));
  document.querySelectorAll('.mockbar button').forEach((b) => b.classList.toggle('on', b.dataset.s === id));
  window.scrollTo(0, 0);
}
document.querySelectorAll('.mockbar button').forEach((b) => b.addEventListener('click', () => go(b.dataset.s)));
document.getElementById('zhprop').addEventListener('change', (e) => { PROP = e.target.checked; render(); });
render();
(() => { const hsh = location.hash.slice(1).split(','); if (hsh.includes('prop')) { document.getElementById('zhprop').checked = true; PROP = true; render(); } const s = hsh.find((x) => /^s\d$/.test(x)); if (s) go(s); })();

</script>
</body>
</html>
