# Beacon programme configuration. Anything not set here takes the default in
# tooling/bcn/config.py. Values marked PLACEHOLDER are unconfirmed with the partner.

[programme]
name = "Beacon example programme"
theme = "default"

[validate]
forbidden = ["semester", "deadline", "next week", "Cohort 7"]
localization = ["Example University", "Department for Education"]
names = true
names_allow = ["Beacon Example"]

[cues]
min_confidence = 0.8     # start strict; loosen only if a real edited topic proves it necessary
max_divergence = 0.10

[subtitles]
format = "srt"           # PLACEHOLDER: "srt", "vtt" or "both"

[delivery]
# PLACEHOLDER: partner delivery spec unconfirmed; the defaults are 25 fps, h264/aac (each
# [compose.layouts.*] entry below carries its own frame size).

# [compose] builds the "widescreen" layout (1920x1080, side_by_side: presenter fills the
# right half, export the edit at 960x1080 square pixels) by default; nothing needs setting
# here to keep that. Uncomment to also build a vertical layout when --layout/the UI selects
# it, or to tune a preset's own fields:
# [compose.layouts.widescreen]
# inset_margin = 16
# [compose.layouts.vertical_stacked]
# split_ratio = 0.45

[bumpers]
intro = ""
outro = ""

[qa]
unit_minutes_min = 85
unit_minutes_max = 110
