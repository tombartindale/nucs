# Bare programme root baked into the image so a fresh deployment boots to a working,
# empty UI with no modules. Replace this file and add module folders by running
# deploy/import-programme.sh, or by copying your own content into /data/programme.

[programme]
name = "New Beacon programme"
theme = "default"

# [compose] builds the "widescreen" layout (1920x1080, side_by_side: presenter fills the
# right half, export the edit at 960x1080 square pixels) by default; nothing needs setting
# here to keep that. See [compose.layouts] in tooling/bcn/config.py for the other built-in
# presets (vertical_stacked, vertical_inset) and their fields.
