# Build the api/worker image from source instead of pulling it from GHCR.
#
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.build.yml up -d --build
#
# Use this when testing a source change end-to-end before it's pushed and built by CI,
# or on a machine that can't reach ghcr.io. For routine local development, prefer
# docker-compose.dev.yml instead (also builds from source, but additionally skips
# proxy/backup and bypasses login).
services:
  api:
    image: !reset null
    build: .
  worker:
    image: !reset null
    build: .
